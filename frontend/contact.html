<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="contact-page">
    <div class="home"><a href="index.html">HOME
        <!-- <img src="frontend\asset\lost&foundlogo.png" alt="error"> -->
    </a></div>
    <div class="contact-container">
      <div class="contact-info">
        <h1>Get in Touch</h1>
        <p>We'd love to hear from you. Whether you have a question, feedback, or just want to say hello — drop us a line and we'll get back to you as soon as possible.</p>
        <div class="contact-detail">
          <div class="contact-detail-icon">✉</div>
          <div>
            <div class="contact-detail-label">Email</div>
            <div class="contact-detail-text">lostAndFound@gmail.com</div>
          </div>
        </div>
        <div class="contact-detail">
          <div class="contact-detail-icon">☎</div>
          <div>
            <div class="contact-detail-label">Phone</div>
            <div class="contact-detail-text">+91 8767964985</div>
          </div>
        </div>
        <div class="contact-detail">
          <div class="contact-detail-icon">⌂</div>
          <div>
            <div class="contact-detail-label">Address</div>
            <div class="contact-detail-text">123 Nagpur Maharashtra India </div>
          </div>
        </div>
      </div>
      <div class="contact-form-card">
        <h2>Send a Message</h2>
        <form>
          <div class="form-row">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" placeholder="Your name" />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="you@email.com" />
            </div>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="How can we help?" />
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Write your message here..."></textarea>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
