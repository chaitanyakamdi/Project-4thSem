<!DOCTYPE html>
<html lang="en">
<head>
    <title>Report Lost Item · L&F</title>
    <link rel="stylesheet" href="./report-style.css">
</head>
<body>

    <h2 class="heading">Report Lost Item</h2>

    <form action="/items" method="POST" enctype="multipart/form-data">

        <h3>Item Information</h3>

        <label>Title</label>
        <input type="text" name="title" placeholder="e.g. Black Laptop Bag" required>

        <label>Description</label>
        <textarea name="description" rows="4" placeholder="Describe the item — colour, brand, distinguishing marks…" required></textarea>

        <div class="field-row">
            <div>
                <label>Category</label>
                <input type="text" name="category" placeholder="e.g. Accessories" required>
            </div>
            <div>
                <label>Status</label>
                <select name="status" required>
                    <option value="">Select status</option>
                    <option value="lost">Lost</option>
                    <option value="found">Found</option>
                </select>
            </div>
        </div>

        <label>Upload Image <span style="font-weight:400;color:#adb0c4;font-size:11px;text-transform:none;letter-spacing:0">(optional)</span></label>
        <input type="file" name="image" accept="image/*">

        <label>Last Known Location</label>
        <input type="text" name="location" placeholder="e.g. Canteen, Ground Floor" required>

        <div class="field-row">
            <div>
                <label>Date</label>
                <input type="date" name="date" required>
            </div>
            <div>
                <label>Time</label>
                <input type="time" name="time" required>
            </div>
        </div>

        <h3>Personal Information</h3>

        <div class="field-row">
            <div>
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Your full name" required>
            </div>
            <div>
                <label>Phone Number</label>
                <input type="text" name="number" placeholder="+91 XXXXX XXXXX" required>
            </div>
        </div>

        <div class="field-row">
            <div>
                <label>College ID</label>
                <input type="text" name="collegeId" placeholder="Optional">
            </div>
            <div>
                <label>Email</label>
                <input type="email" name="email" placeholder="you@college.edu" required>
            </div>
        </div>

        <div class="field-row">
            <div>
                <label>Department</label>
                <input type="text" name="department" placeholder="e.g. Mechanical Engg.">
            </div>
            <div>
                <label>Role</label>
                <input type="text" name="role" placeholder="e.g. Student / Faculty">
            </div>
        </div>

        <button type="submit">Submit Report</button>

    </form>

</body>
</html>
